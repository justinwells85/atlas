spring.application.name=atlas-mcp

spring.datasource.url=jdbc:postgresql://localhost:5432/atlas
spring.datasource.username=${user.name}

server.address=127.0.0.1
server.port=8081

# Flyway owns the schema; JPA must not auto-DDL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Vendor-specific migration paths (V18 has separate Postgres + MariaDB
# variants because DROP CONSTRAINT vs DROP INDEX syntax diverges).
spring.flyway.locations=classpath:db/migration,classpath:db/migration_{vendor}
