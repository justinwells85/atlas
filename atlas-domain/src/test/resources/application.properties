# Flyway: scan the common migration directory plus the vendor-specific
# subdirectory for the detected database type. The {vendor} placeholder
# is replaced by Spring Boot at startup with one of postgresql / mariadb /
# mysql / etc., so only the matching subdir is loaded — V18's two
# implementations don't collide.
spring.flyway.locations=classpath:db/migration,classpath:db/migration_{vendor}
