spring.application.name=atlas

spring.datasource.url=jdbc:postgresql://localhost:5432/atlas
spring.datasource.username=${user.name}

server.address=127.0.0.1

# Flyway owns the schema; JPA must not auto-DDL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# LLM gateway provider — see ADR-013 + DD-012. Default is the direct
# Anthropic SDK; "internal-gateway" is the org-LLM-API stub (deferred).
atlas.llm.provider=anthropic
atlas.llm.anthropic.api-key=${ANTHROPIC_API_KEY:}
atlas.llm.anthropic.model=claude-sonnet-4-6
