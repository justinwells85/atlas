# confluence-dogfood profile (Phase 5.8 M4). Activates BOTH wiki sinks
# simultaneously: the public ATLAS Confluence space (existing dogfood) AND
# a local Markdown vault (Obsidian-browseable). Run with:
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=confluence-dogfood
#   # or: java -jar atlas-confluence-sync.jar --spring.profiles.active=confluence-dogfood
#
# This profile is explicitly NOT for confidential code — it requires the
# ATLAS_CONFLUENCE_* env vars to be set and pushes content to an external
# service. Use the default (no profile) configuration for confidential
# ownership-analysis instances; that path keeps only local-markdown active.

atlas.wiki.sinks.confluence.enabled=true
atlas.wiki.sinks.local-markdown.enabled=true

# Default vault location for the public dogfood. Override via
# ATLAS_WIKI_LOCAL_MARKDOWN_PATH if a different vault is wanted.
atlas.wiki.sinks.local-markdown.path=${ATLAS_WIKI_LOCAL_MARKDOWN_PATH:${user.home}/atlas-vault}
