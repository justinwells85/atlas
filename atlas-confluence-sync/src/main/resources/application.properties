spring.application.name=atlas-confluence-sync

spring.datasource.url=jdbc:postgresql://localhost:5432/atlas
spring.datasource.username=${user.name}

server.address=127.0.0.1
server.port=8082

# Flyway owns the schema; JPA must not auto-DDL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Confluence Cloud target. Credentials live in the user's shell env so the
# token never lands in this file (or git history).
atlas.confluence.base-url=https://justinwellsanderson.atlassian.net/wiki
atlas.confluence.space-key=ATLAS
atlas.confluence.email=${ATLAS_CONFLUENCE_EMAIL:}
atlas.confluence.api-token=${ATLAS_CONFLUENCE_API_TOKEN:}
