spring.application.name=atlas-confluence-sync

spring.datasource.url=jdbc:postgresql://localhost:5432/atlas
spring.datasource.username=${user.name}

server.address=127.0.0.1
server.port=8082

# Flyway owns the schema; JPA must not auto-DDL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Vendor-specific migration paths (V18 has separate Postgres + MariaDB
# variants because DROP CONSTRAINT vs DROP INDEX syntax diverges).
spring.flyway.locations=classpath:db/migration,classpath:db/migration_{vendor}

# Wiki sink toggles (Phase 5.8). Each sink is independently enabled, so
# multiple sinks can run side-by-side (for parity checks) or only one is
# active per Atlas instance. M1 leaves Confluence on by default
# (matchIfMissing=true on the @ConditionalOnProperty); M4 flips the
# defaults so local-markdown is on by default and Confluence is opt-in.
# atlas.wiki.sinks.confluence.enabled=true   (default in M1, via matchIfMissing)
# atlas.wiki.sinks.local-markdown.enabled / .path arrive in Phase 5.8 M3.

# Confluence Cloud target. Credentials live in the user's shell env so the
# token never lands in this file (or git history). Read only when the
# Confluence sink is enabled.
atlas.confluence.base-url=https://justinwellsanderson.atlassian.net/wiki
atlas.confluence.space-key=ATLAS
atlas.confluence.email=${ATLAS_CONFLUENCE_EMAIL:}
atlas.confluence.api-token=${ATLAS_CONFLUENCE_API_TOKEN:}

# Scheduled sync interval (cron). Default: every 15 minutes.
# Tests override to a never-fires cron via @DynamicPropertySource so the
# schedule does not interfere with assertion timing.
atlas.confluence.sync.cron=0 */15 * * * *
