spring.application.name=atlas-confluence-sync

# Flyway owns the schema; JPA must not auto-DDL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Vendor-specific migration paths (V18 has separate Postgres + MariaDB
# variants because DROP CONSTRAINT vs DROP INDEX syntax diverges).
spring.flyway.locations=classpath:db/migration,classpath:db/migration_{vendor}

# Test-classpath sink defaults. Spring Boot loads this file in place of the
# main src/main/resources/application.properties when the test classpath is
# active, so production-default values (Phase 5.8 M4: local-markdown on,
# confluence off) are deliberately inverted here back to the pre-M4 layout
# (confluence on, local-markdown off). Tests opt out per-test via
# @SpringBootTest properties or @DynamicPropertySource (see
# WikiSinkDisabledTest, DualSinkIntegrationTest).
atlas.wiki.sinks.confluence.enabled=true
atlas.wiki.sinks.local-markdown.enabled=false

# Placeholder Confluence credentials so beans can construct in tests that
# don't override these via @DynamicPropertySource (e.g. the smoke test).
# Tests that hit a WireMock instance overwrite base-url/email/api-token.
atlas.confluence.base-url=http://test.invalid
atlas.confluence.space-key=ATLAS
atlas.confluence.email=test@example.com
atlas.confluence.api-token=test-token
# Never-fires cron so @Scheduled doesn't kick off mid-test.
atlas.confluence.sync.cron=-
